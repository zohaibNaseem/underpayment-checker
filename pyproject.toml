[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "underpayment-checker"
version = "0.1.0"
description = "Flags insurer payments below the rate the insurer publicly publishes for that provider."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "ijson>=3.2",
    "pandas>=2.0",
    "pyarrow>=14",
    "reportlab>=4.0",
]

[project.optional-dependencies]
ai = ["anthropic>=1.0"]
app = ["streamlit>=1.30"]
dev = ["pytest>=7", "ruff>=0.5", "pymupdf>=1.23"]

[project.scripts]
upc = "underpayment_checker.command_line:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
underpayment_checker = ["transform/sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["underpayment_checker", "helpers"]
